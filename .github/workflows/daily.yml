name: Daily data refresh

on:
  schedule:
    - cron: "15 5 * * *"   # every day at 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Fetch, check, store and report
        run: python src/main.py
      - name: Commit updated data
        run: |
          git config user.name "air-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data.json
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
